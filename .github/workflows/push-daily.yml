name: 매일 알림

# 한국 아침 8시. 습관은 하루의 고정된 시각에 붙기 때문에
# 방문이 가장 많은 오후가 아니라 아침으로 잡았다.
#
# 크론은 03:40 KST(18:40 UTC)에 걸어 두고 send-push.mjs가 08:00까지 기다린다.
# 네 시간 넘게 당겨 두는 이유 — GitHub 공용 크론은 몇 분이 아니라 몇 시간씩 밀린다.
# 실행 기록을 API로 재 본 지연(분)이다.
#
#   8/21~8/26   26 ~ 31          ← 이때는 08:00 크론으로 08:26~08:31에 나갔다
#   8/27~8/29   327  470  305    ← 오후 1~4시에 나갔다
#   8/30~9/03   131 139 165 117 152
#   9/04        106              ← 07:30으로 당긴 첫날. 그래도 09:15였다
#
# 중앙값이 152분이라 30분 여유로는 아무것도 못 흡수한다. 03:40이면 260분까지
# 흡수하고, 9회 중 8회가 그 안에 든다. 저장소가 public이라 Actions 분은 무제한이고
# 기다리는 동안 도는 것은 sleep 하나뿐이다.
#
# 분을 40으로 둔 것도 일부러다 — 정각·30분에 크론이 몰려서 밀린다.
on:
  schedule:
    - cron: '40 18 * * *'
  workflow_dispatch: # 손으로도 한 번 돌려볼 수 있게

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/send-push.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # 손으로 돌린 것은 기다리지 않고 바로 보낸다. 예전에는 「08:00까지 45분
          # 넘게 남았으면 손으로 돌린 것」으로 시각을 보고 짐작했는데, 크론을 네 시간
          # 당기면 그 짐작이 무너진다 — 트리거 종류를 그대로 넘긴다.
          SCHEDULED: ${{ github.event_name == 'schedule' }}
