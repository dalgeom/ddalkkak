name: 매일 알림

# 한국 아침 8시. GitHub 크론은 UTC라 23:00이 그 시각이다.
# 습관은 하루의 고정된 시각에 붙기 때문에 방문이 가장 많은 오후가 아니라 아침으로 잡았다.
#
# 크론을 07:30(22:30 UTC)로 당겨 두고 send-push.mjs가 08:00까지 기다린다.
# GitHub 공용 크론은 정각에 몰려 밀리는데, 몇 분이 아니라 몇 시간씩 밀렸다 —
# 실행 기록으로 재 보니 8/23~8/26은 08:26~08:30이었지만 8/27 13:27, 8/28 15:50,
# 8/29 13:05, 그 뒤로도 매일 09:56~10:44다. 아침 알림이 오후에 나가고 있었다.
# 30분 일찍 잡아 두면 웬만한 지연은 08:00 안에서 흡수된다.
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch: # 손으로도 한 번 돌려볼 수 있게

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/send-push.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
