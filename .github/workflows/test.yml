name: test

# 테스트 게이트. 한때 package.json의 build에 물려 뒀는데, 그러면 테스트가 아니라
# 배포가 멈춘다(8/14에 실제로 8분간 배포가 막혔다). 검증은 여기서, 배포는 배포대로.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      # todaySafety·bankIntegrity는 `git show origin/main:…`으로 기준선을 읽고, 못 읽으면
      # 「검증 불가」로 조용히 통과한다. 기본 얕은 체크아웃(depth 1)에서는 그 ref가 없어
      # 두 가드가 CI에서 한 번도 작동한 적이 없었다 — 8/11 완주율 15% 사고를 막는 가드다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 기준선을 명시한다. main에 직접 푸시하는 프로젝트라 origin/main은 곧 방금 푸시한
      # 커밋이고, 그러면 새 코드를 새 코드와 비교해 가드가 빈손으로 통과한다(9/10 확인).
      # PR에서는 안 넘긴다 — 거기서는 origin/main이 맞는 기준선이다.
      - run: npm test
        env:
          BASELINE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
      # 빌드까지 통과해야 머지 가능 — 배포 실패를 PR 단계에서 잡는다
      - run: npm run build
