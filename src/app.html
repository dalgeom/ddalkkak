<!doctype html>
<html lang="ko">
	<head>
		<!-- iOS·안드로이드가 숫자/날짜를 전화번호로 오인해 파란 링크로 칠하는 것을 막는다 -->
		<meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#efe7d8" />
		<!-- /favicon.ico는 링크가 없어도 브라우저와 크롤러가 무조건 찾아간다.
		     없으면 404가 쌓여 Search Console에 잡히므로 파일을 두고 함께 건다. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<!-- iOS 홈 화면 추가(서비스워커 없이도 동작) -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="딸깍" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<!-- 폰트 CSS를 HTML 파싱보다 먼저 요청한다. 이 CSS가 늦게 시작하면 그 안의 woff2 subset도
		     그만큼 밀려서, 폰트가 첫 페인트 뒤에 도착해 텍스트가 다시 흐르며 레이아웃이 밀린다(CLS). -->
		<link
			rel="preload"
			as="style"
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
		/>
		<!-- description은 라우트마다 svelte:head에서 지정한다. 여기에 기본값을 두면 라우트 것보다
		     먼저 나와서 모든 페이지가 같은 설명을 물게 된다(검색결과에 전부 같은 문구가 뜬다). -->
		<!-- Open Graph / 카톡·트위터 공유 카드 (제목·설명·url은 라우트별 svelte:head에서 지정)
		     og:image는 상대경로면 카톡·페북 스크래퍼가 못 읽는다 — 반드시 절대 URL(도메인 바뀌면 여기도 교체) -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="딸깍 퍼즐" />
		<meta property="og:image" content="https://ddalkkak.app/og-default.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://ddalkkak.app/og-default.png" />
		<!-- 검색엔진용 구조화 데이터 -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "딸깍",
				"alternateName": "딸깍 두뇌 퍼즐",
				"url": "https://ddalkkak.app/",
				"description": "매일 새로 열리는 두뇌 퍼즐. 발견형 퍼즐·상식 퀴즈·성냥개비·전개도를 모두가 같은 문제로 풉니다.",
				"inLanguage": "ko"
			}
		</script>
		<!-- 애드센스 사이트 연결용 스크립트. 심사를 받으려면 승인 전에도 실려 있어야 한다.
		     이것만으로는 광고가 뜨지 않는다 — 실제 광고는 승인 후 AdSlot에 유닛을 넣을 때부터.
		     게시자 ID는 페이지 소스에 그대로 노출되는 공개 식별자다(비밀 아님). -->
		<script
			async
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2389523583052577"
			crossorigin="anonymous"
		></script>
		<!-- Google Analytics (GA4)
		     자동화 브라우저는 세지 않는다. 배포한 기능을 프로덕션에서 확인할 때마다 헤드리스
		     브라우저가 실제 방문으로 잡혀 세션 수와 이탈률을 왜곡했다 — 2026-08-20에 /matchstick
		     세션이 평소 1~4에서 11로 튄 것이 전부 검증 접속이었다. GA4 공식 옵트아웃 플래그라
		     스크립트를 지우지 않고도 전송만 멈춘다. -->
		<script>
			// webdriver 플래그는 CDP로 직접 붙으면 false라 못 믿는다. 헤드리스는 UA에 남는다.
			if (/HeadlessChrome|Headless/i.test(navigator.userAgent) || location.search.includes('noga=1')) {
				window['ga-disable-G-J30M6XGVJ6'] = true;
			}
		</script>
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-J30M6XGVJ6"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() { dataLayer.push(arguments); }
			gtag('js', new Date());
			gtag('config', 'G-J30M6XGVJ6');
		</script>
		<!-- 네이버 웹마스터도구 소유 확인 -->
		<meta name="naver-site-verification" content="59d078da60eaf99125937a5449df9136518c7be9" />
		<style>
			html {
				background: #efe7d8;
			}
			/*
			 * 폰트 스왑으로 생기는 레이아웃 이동(CLS) 방지.
			 * 실측(100px 기준): Pretendard는 줄높이 119px·너비 716px인데
			 * 윈도우 기본 폴백인 맑은 고딕은 133px·831px — 16% 넓고 12% 높다.
			 * 그래서 웹폰트가 도착하는 순간 줄바꿈까지 바뀌며 본문 전체가 밀린다.
			 * 폴백의 메트릭을 Pretendard에 맞춰 두면 스왑이 일어나도 자리가 그대로다.
			 *   size-adjust  716.22 / 831.5 = 86.1%
			 *   ascent+descent  119 / (133 x 0.861) → 112% + 26% = 138%
			 * 이 값으로 성냥 가이드 CLS 0.245 → 0.066(GOOD). 86.5/113으로 더 키워도 봤지만
			 * 줄바꿈이 달라지며 0.109로 오히려 나빠져서 실측이 좋은 쪽을 남겼다.
			 * 맑은 고딕이 없는 환경(안드로이드·iOS)에서는 이 패밀리가 해석되지 않아
			 * 다음 폰트로 그냥 넘어간다 — 그쪽 렌더링은 건드리지 않는다.
			 */
			@font-face {
				font-family: 'Pretendard Fallback';
				src: local('Malgun Gothic');
				size-adjust: 86.1%;
				ascent-override: 112%;
				descent-override: 26%;
				line-gap-override: 0%;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
